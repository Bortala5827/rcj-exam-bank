<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>支付结果 · RCJ Lab</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f8fafc; color: #0f172a; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 36px 32px; text-align: center; max-width: 400px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,.08); }
    .icon { font-size: 52px; margin-bottom: 12px; }
    h1 { font-size: 1.3rem; margin: 0 0 10px; }
    p { color: #64748b; font-size: .92rem; line-height: 1.6; margin: 0 0 22px; }
    a.btn { display: inline-block; background: #0d9488; color: #fff; text-decoration: none; padding: 12px 30px; border-radius: 10px; font-weight: 700; font-size: .95rem; }
    a.btn:hover { background: #0f766e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">⏳</div>
    <h1 id="title">正在确认支付…</h1>
    <p id="desc">请稍候，我们正在与 PayPal 确认你的付款。</p>
    <a class="btn" id="back" href="./" style="display:none">返回商店</a>
  </div>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var token = q.get('token');
      var item = q.get('item') || '';
      var email = q.get('email') || '';
      var cur = q.get('cur') || 'CNY';
      var cancel = q.get('cancel');
      var icon = document.getElementById('icon');
      var title = document.getElementById('title');
      var desc = document.getElementById('desc');
      var back = document.getElementById('back');
      back.style.display = 'inline-block';

      if (cancel) {
        icon.textContent = '✖️';
        title.textContent = '已取消支付';
        desc.textContent = '你没有完成付款，订单已取消。';
        return;
      }
      if (!token) {
        icon.textContent = '⚠️';
        title.textContent = '缺少订单参数';
        desc.textContent = '链接不完整，请联系站长。';
        return;
      }
      fetch('/api/paypal/capture', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: token, item: item, email: email, currency: cur })
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d.ok) {
          icon.textContent = '✅';
          title.textContent = '支付成功！';
          desc.textContent = '我会尽快联系你交付 🎉';
        } else {
          icon.textContent = '⚠️';
          title.textContent = '支付确认失败';
          desc.textContent = (d.error || '未知错误') + '，如已被扣款请截图联系站长。';
        }
      }).catch(function (e) {
        icon.textContent = '⚠️';
        title.textContent = '网络错误';
        desc.textContent = '无法连接服务器：' + e.message + '，请重试或联系站长。';
      });
    })();
  </script>
</body>
</html>
