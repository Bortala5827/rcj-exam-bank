<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{考试名} · RCJ Exam Hub</title>
  <script>
    // 自动注销旧版 Service Worker，防止其缓存旧版 list.js/css 导致更新不生效
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        registrations.forEach(function (registration) { registration.unregister(); });
      });
    }
  </script>
  <link rel="stylesheet" href="/assets/list.20260731.css?v=2">
</head>
<body>
  <div id="rcj-app"></div>
  <script>
    /*
     * RCJ_META 字段：
     *   title       : 页面大标题（如“省考”），显示于 h1，也用于真题说明文案（动态，不再写死“国考”）
     *   subtitle    : 副标题
     *   subjectOrder: 科目显示顺序（数组），决定真题库分组先后；不填则用默认顺序
     *                 （默认含 行测/申论/公共科目/专业科目/公基/职测/教综/学科）
     * RCJ_QUESTIONS : 题目索引数组（可选）。没有真题题目就留空数组 []。
     * RCJ_PDFS      : 由 <考试目录>/assets/pdf-manifest.js 提供（见下）。
     */
    window.RCJ_META = {
      title: '省考',
      subtitle: '各省公务员考试 · 历年真题库（行测 / 申论 原卷）',
      subjectOrder: ['行测', '申论']
    };
    window.RCJ_QUESTIONS = [];
  </script>
  <script src="assets/pdf-manifest.js"></script>
  <script src="/assets/list.20260731.js?v=2"></script>
</body>
</html>
