<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LEARN · 刷一张知识，看懂一张关系</title>
  <meta name="description" content="把复杂现实压成一张能刷的关系卡。刷着刷着，就多理解一点自己身处的社会。">
  <link rel="stylesheet" href="learn.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='system-ui' font-size='30' font-weight='800' fill='white'%3EL%3C/text%3E%3C/svg%3E">
</head>
<body>

  <div class="ln-bar">
    <div class="ln-actions">
      <button class="ln-btn on" id="btnSwipe">刷</button>
      <button class="ln-btn" id="btnMy">我的</button>
    </div>
    <button class="ln-btn home-top" id="homeMini" title="回到 Exam 首页">⌂ 首页</button>
  </div>

  <!-- 刷视图 -->
  <div id="swipeView">
    <div class="ln-stage">
      <div class="ln-count" id="count"></div>
      <div id="deck"></div>
    </div>
  </div>

  <!-- 我的知识视图 -->
  <div id="myView" class="hidden">
    <div class="ln-stage"></div>
  </div>

  <!-- 底部操作条 -->
  <div class="ln-foot" id="foot">
    <button class="act prev" id="actPrev">上一张</button>
    <button class="act fav" id="actFav">收藏<small>右滑</small></button>
    <button class="act seen" id="actSeen">下一张<small>左滑</small></button>
  </div>

  <script src="cards.js"></script>
  <script src="learn.js"></script>
</body>
</html>
