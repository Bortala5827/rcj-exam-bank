<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RCJ 客服后台</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; background: #f3f4f6; height: 100vh; display: flex; flex-direction: column; }
    .login-page { display: flex; align-items: center; justify-content: center; height: 100vh; }
    .login-box { background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 360px; }
    .login-box h1 { font-size: 20px; margin-bottom: 24px; color: #111827; text-align: center; }
    .login-box input { width: 100%; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; margin-bottom: 12px; font-size: 14px; }
    .login-box button { width: 100%; padding: 10px; background: #0d9488; color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .login-box button:hover { background: #0f766e; }
    .login-error { color: #ef4444; font-size: 13px; margin-bottom: 12px; text-align: center; }
    .app { display: none; flex: 1; flex-direction: column; }
    .app.show { display: flex; }
    .header { background: #0d9488; color: white; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 16px; }
    .header button { background: rgba(255,255,255,0.2); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
    .main { flex: 1; display: flex; overflow: hidden; }
    .sidebar { width: 280px; background: white; border-right: 1px solid #e5e7eb; overflow-y: auto; }
    .conv-item { padding: 12px 16px; border-bottom: 1px solid #f3f4f6; cursor: pointer; transition: background 0.15s; }
    .conv-item:hover { background: #f9fafb; }
    .conv-item.active { background: #f0fdfa; border-left: 3px solid #0d9488; }
    .conv-name { font-weight: 600; font-size: 14px; color: #111827; margin-bottom: 4px; }
    .conv-preview { font-size: 12px; color: #6b7280; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-time { font-size: 11px; color: #9ca3af; margin-top: 4px; }
    .chat { flex: 1; display: flex; flex-direction: column; background: #f9fafb; }
    .chat-header { padding: 12px 20px; background: white; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
    .chat-header h2 { font-size: 15px; color: #111827; }
    .chat-actions { display: flex; gap: 8px; }
    .chat-actions button { padding: 6px 12px; border: 1px solid #d1d5db; background: white; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .chat-actions button:hover { background: #f9fafb; }
    .messages { flex: 1; overflow-y: auto; padding: 20px; }
    .msg { margin-bottom: 16px; display: flex; }
    .msg.agent { justify-content: flex-start; }
    .msg.customer { justify-content: flex-end; }
    .msg-bubble { max-width: 70%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
    .msg.agent .msg-bubble { background: white; border: 1px solid #e5e7eb; border-bottom-left-radius: 4px; }
    .msg.customer .msg-bubble { background: #0d9488; color: white; border-bottom-right-radius: 4px; }
    .msg-time { font-size: 11px; color: #9ca3af; margin-top: 4px; }
    .chat-input { padding: 16px 20px; background: white; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; }
    .chat-input input { flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; }
    .chat-input input:focus { outline: none; border-color: #0d9488; }
    .chat-input button { padding: 10px 20px; background: #0d9488; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .chat-input button:disabled { background: #9ca3af; cursor: not-allowed; }
    .empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #9ca3af; font-size: 14px; }
    .refresh-btn { background: none; border: none; color: white; cursor: pointer; font-size: 18px; padding: 0 8px; }
  </style>
</head>
<body>
  <div class="login-page" id="loginPage">
    <div class="login-box">
      <h1>💬 RCJ 客服后台</h1>
      <div class="login-error" id="loginError" style="display:none;"></div>
      <input type="email" id="loginEmail" placeholder="邮箱" value="admin@example.com">
      <input type="password" id="loginPassword" placeholder="密码" value="admin123">
      <button onclick="doLogin()">登录</button>
    </div>
  </div>

  <div class="app" id="app">
    <div class="header">
      <h1>💬 RCJ 客服后台</h1>
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="refresh-btn" onclick="loadConversations()" title="刷新">🔄</button>
        <button onclick="doLogout()">退出</button>
      </div>
    </div>
    <div class="main">
      <div class="sidebar" id="sidebar"></div>
      <div class="chat" id="chat">
        <div class="empty">选择一个会话开始聊天</div>
      </div>
    </div>
  </div>

  <script>
    var API = 'https://supportly-server-api.rcjstore.workers.dev';
    var token = localStorage.getItem('rcj_admin_token');
    var currentConv = null;
    var pollTimer = null;

    if (token) { showApp(); loadConversations(); }

    function doLogin() {
      var email = document.getElementById('loginEmail').value;
      var password = document.getElementById('loginPassword').value;
      var errorEl = document.getElementById('loginError');
      fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      }).then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.error) { errorEl.textContent = d.error.message || '登录失败'; errorEl.style.display = 'block'; return; }
          token = d.data.token;
          localStorage.setItem('rcj_admin_token', token);
          showApp();
          loadConversations();
        }).catch(function(e) { errorEl.textContent = '网络错误：' + e.message; errorEl.style.display = 'block'; });
    }

    function doLogout() {
      localStorage.removeItem('rcj_admin_token');
      token = null;
      stopPolling();
      document.getElementById('app').classList.remove('show');
      document.getElementById('loginPage').style.display = 'flex';
    }

    function showApp() {
      document.getElementById('loginPage').style.display = 'none';
      document.getElementById('app').classList.add('show');
    }

    function authHeaders() {
      return { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };
    }

    function loadConversations() {
      fetch(API + '/api/conversations', { headers: authHeaders() })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var sidebar = document.getElementById('sidebar');
          sidebar.innerHTML = '';
          if (!d.data || d.data.length === 0) {
            sidebar.innerHTML = '<div style="padding:20px;text-align:center;color:#9ca3af;font-size:13px;">暂无会话</div>';
            return;
          }
          d.data.forEach(function(conv) {
            var div = document.createElement('div');
            div.className = 'conv-item' + (currentConv === conv.id ? ' active' : '');
            div.innerHTML = '<div class="conv-name">' + (conv.contactName || '匿名访客') + '</div>' +
              '<div class="conv-preview">' + (conv.lastMessage || '暂无消息') + '</div>' +
              '<div class="conv-time">' + formatTime(conv.updatedAt || conv.createdAt) + '</div>';
            div.onclick = function() { selectConversation(conv.id); };
            sidebar.appendChild(div);
          });
        }).catch(function(e) { console.error('加载会话失败', e); });
    }

    function selectConversation(id) {
      currentConv = id;
      loadConversations();
      loadMessages(id);
      startPolling();
    }

    function loadMessages(id) {
      fetch(API + '/api/conversations/' + id + '/messages', { headers: authHeaders() })
        .then(function(r) { return r.json(); })
        .then(function(d) {
          var chat = document.getElementById('chat');
          chat.innerHTML = '<div class="chat-header"><h2>会话详情</h2><div class="chat-actions"><button onclick="resolveConv()">标记已解决</button></div></div>' +
            '<div class="messages" id="messages"></div>' +
            '<div class="chat-input"><input type="text" id="msgInput" placeholder="输入回复..." maxlength="2000"><button onclick="sendMessage()">发送</button></div>';
          var messagesEl = document.getElementById('messages');
          if (!d.data || d.data.length === 0) {
            messagesEl.innerHTML = '<div class="empty" style="height:200px;">暂无消息</div>';
            return;
          }
          d.data.forEach(function(msg) { renderMessage(msg, messagesEl); });
          messagesEl.scrollTop = messagesEl.scrollHeight;
          document.getElementById('msgInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMessage(); });
        }).catch(function(e) { console.error('加载消息失败', e); });
    }

    function renderMessage(msg, container) {
      var div = document.createElement('div');
      div.className = 'msg ' + (msg.direction === 'outbound' || msg.senderType === 'agent' ? 'agent' : 'customer');
      div.innerHTML = '<div class="msg-bubble">' + (msg.content || '(空消息)') + '</div>';
      container.appendChild(div);
    }

    function sendMessage() {
      var input = document.getElementById('msgInput');
      var text = input.value.trim();
      if (!text || !currentConv) return;
      input.value = '';
      var btn = document.querySelector('.chat-input button');
      btn.disabled = true;
      fetch(API + '/api/conversations/' + currentConv + '/messages', {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ content: text })
      }).then(function(r) { return r.json(); })
        .then(function(d) {
          if (d.error) { alert('发送失败：' + d.error.message); return; }
          loadMessages(currentConv);
        }).catch(function(e) { alert('发送失败：' + e.message); })
        .finally(function() { btn.disabled = false; });
    }

    function resolveConv() {
      if (!currentConv) return;
      if (!confirm('确定标记此会话为已解决？')) return;
      fetch(API + '/api/conversations/' + currentConv + '/resolve', {
        method: 'POST', headers: authHeaders()
      }).then(function() { loadConversations(); currentConv = null; document.getElementById('chat').innerHTML = '<div class="empty">选择一个会话开始聊天</div>'; stopPolling(); })
        .catch(function(e) { alert('操作失败：' + e.message); });
    }

    function startPolling() {
      stopPolling();
      pollTimer = setInterval(function() { if (currentConv) loadMessages(currentConv); loadConversations(); }, 5000);
    }

    function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

    function formatTime(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }
  </script>
</body>
</html>
